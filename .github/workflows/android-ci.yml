name: Android Gallery CI

on: 
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        submodules: true # На случай, если есть зависимые модули

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17' # Fossify обычно использует 17 или 21, 17 - самый безопасный выбор

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build FOSS Release APK
      # <-- ВАЖНО: Собираем конкретно assembleFossRelease, а не просто assembleRelease
      run: ./gradlew assembleFossRelease -PABI_SPLITS=true --no-daemon

    - name: List generated APKs
      run: |
        echo "📦 Сгенерированные APK:"
        ls -lh app/build/outputs/apk/foss/release/*.apk || echo "APK не найдены"

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: gallery-foss-release-arm64
        # Путь учитывает flavor 'foss' и build type 'release'
        path: app/build/outputs/apk/foss/release/*arm64-v8a-release.apk
        retention-days: 7
        if-no-files-found: error
